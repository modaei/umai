[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umai"
version = "0.1.0"
description = "Read-only Umetrics AI assistant."
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "SQLAlchemy>=2.0,<3",
    "pymysql>=1.1,<2",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "Pillow>=10,<12",
    # Dynograph classifier. Saved scikit-learn models only load reliably with the
    # exact version that trained them, so scikit-learn is pinned.
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scikit-learn==1.7.2",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "deepeval>=3,<4",
]

[project.scripts]
umai-index-operational-text = "umai.rag.index_operational_text:main"
umai-process-rag-index-events = "umai.rag.process_index_events:main"
umai-vector-db-migrate = "umai.rag.migrate_vector_db:main"
umai-evaluate = "umai.evals.runner:main"
umai-card-classifier = "umai.rod_pump_health.classifier_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
umai = ["evals/cases/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
